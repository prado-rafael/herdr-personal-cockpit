<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!--
    The Settings picker's thumbnail for this layout. Proportions come from
    cockpit.json against a 1920x1032 window: sidebar 268px -> 45, brand 46 -> 9,
    footer 69 -> 13, tab bar 42 -> 8, status 28 -> 5. The four sidebar blocks
    share the rest equally, as their weight:1 says.

    Drawn in graphite dark, the theme the layout inherits here. It renders at
    about 115x62 on screen, so everything is chunky on purpose: the two bottom
    blocks are the whole point, and they have to read as "a list with something
    urgent in it" at that size.
  -->
  <rect width="320" height="200" fill="#0d0e11"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="45" height="200" fill="#131519"/>
  <rect x="45" y="0" width="1" height="200" fill="#24272c"/>

  <!-- brand -->
  <circle cx="9" cy="5" r="2.5" fill="#5a6069"/>
  <rect x="15" y="4" width="16" height="2" rx="1" fill="#878d96"/>

  <!-- spaces -->
  <rect x="0" y="9" width="45" height="1" fill="#1d2025"/>
  <rect x="5" y="14" width="14" height="2" rx="1" fill="#5a6069"/>
  <rect x="4" y="21" width="37" height="7" rx="2" fill="#1e2127"/>
  <circle cx="9" cy="24.5" r="2" fill="#5bbf8f"/>
  <rect x="14" y="23.5" width="16" height="2" rx="1" fill="#c8ccd2"/>

  <!-- agents -->
  <rect x="0" y="53" width="45" height="1" fill="#1d2025"/>
  <rect x="5" y="58" width="13" height="2" rx="1" fill="#5a6069"/>
  <rect x="5" y="66" width="24" height="2" rx="1" fill="#3a3f47"/>
  <rect x="5" y="72" width="31" height="2" rx="1" fill="#3a3f47"/>
  <rect x="5" y="78" width="19" height="2" rx="1" fill="#3a3f47"/>

  <!-- pull requests: the panel, with one row that wants you -->
  <rect x="0" y="98" width="45" height="1" fill="#24272c"/>
  <rect x="5" y="103" width="18" height="2.5" rx="1.25" fill="#878d96"/>
  <rect x="25" y="102" width="9" height="4.5" rx="2.25" fill="#3a2a16"/>
  <rect x="26.5" y="103.5" width="6" height="1.5" rx="0.75" fill="#d98a3d"/>
  <!-- refresh / dock / minimise -->
  <circle cx="37" cy="104.5" r="1.5" fill="none" stroke="#4a4f57" stroke-width="0.8"/>
  <rect x="40.5" y="104" width="3" height="1" rx="0.5" fill="#4a4f57"/>
  <rect x="4" y="111" width="37" height="11" rx="2" fill="#1e2127"/>
  <circle cx="8.5" cy="115" r="1.5" fill="#d98a3d"/>
  <rect x="12" y="114" width="23" height="2" rx="1" fill="#c8ccd2"/>
  <rect x="12" y="118.5" width="10" height="1.5" rx="0.75" fill="#5a6069"/>
  <rect x="24" y="118.5" width="5" height="1.5" rx="0.75" fill="#5bbf8f"/>
  <rect x="30.5" y="118.5" width="5" height="1.5" rx="0.75" fill="#c76a6a"/>
  <rect x="12" y="126" width="26" height="2" rx="1" fill="#3a3f47"/>
  <rect x="12" y="131" width="20" height="2" rx="1" fill="#3a3f47"/>

  <!-- kraken tasks: the panel, with its GitHub label chips -->
  <rect x="0" y="142.5" width="45" height="1" fill="#24272c"/>
  <rect x="5" y="147.5" width="20" height="2.5" rx="1.25" fill="#878d96"/>
  <!-- new task / refresh / gear / dock / minimise -->
  <rect x="29" y="148" width="3" height="3" rx="0.6" fill="none" stroke="#4a4f57" stroke-width="0.7"/>
  <circle cx="35" cy="149.5" r="1.5" fill="none" stroke="#4a4f57" stroke-width="0.8"/>
  <rect x="39.5" y="149" width="3" height="1" rx="0.5" fill="#4a4f57"/>
  <rect x="4" y="156" width="37" height="11" rx="2" fill="#1e2127"/>
  <circle cx="8.5" cy="160" r="1.5" fill="#5a6069"/>
  <rect x="12" y="159" width="25" height="2" rx="1" fill="#c8ccd2"/>
  <rect x="12" y="163.5" width="9" height="3" rx="1.5" fill="#24415f"/>
  <rect x="22.5" y="163.5" width="11" height="3" rx="1.5" fill="#3d3566"/>
  <rect x="12" y="171" width="24" height="2" rx="1" fill="#3a3f47"/>
  <rect x="12" y="176" width="29" height="2" rx="1" fill="#3a3f47"/>

  <!-- footer -->
  <rect x="0" y="187" width="45" height="1" fill="#1d2025"/>
  <circle cx="8" cy="193.5" r="2" fill="#4a4f57"/>
  <rect x="13" y="192.5" width="14" height="2" rx="1" fill="#3a3f47"/>

  <!-- tab bar -->
  <rect x="52" y="2.5" width="18" height="5" rx="2" fill="#1e2127"/>
  <rect x="55" y="4.5" width="9" height="1.5" rx="0.75" fill="#878d96"/>
  <rect x="73" y="2.5" width="18" height="5" rx="2" fill="#15171b"/>
  <rect x="76" y="4.5" width="9" height="1.5" rx="0.75" fill="#4a4f57"/>

  <!-- the active tab's pane, as a card -->
  <rect x="52" y="12" width="262" height="179" rx="4" fill="#0a0b0d" stroke="#24272c" stroke-width="1"/>
  <rect x="52" y="12" width="262" height="9" rx="4" fill="#15171b"/>
  <rect x="52" y="17" width="262" height="4" fill="#15171b"/>
  <rect x="58" y="15.5" width="22" height="2" rx="1" fill="#5a6069"/>
  <rect x="52" y="21" width="262" height="1" fill="#24272c"/>
  <g fill="#2f343b">
    <rect x="60" y="31" width="88" height="2.5" rx="1.25"/>
    <rect x="60" y="39" width="150" height="2.5" rx="1.25"/>
    <rect x="60" y="47" width="119" height="2.5" rx="1.25"/>
    <rect x="60" y="59" width="166" height="2.5" rx="1.25"/>
    <rect x="60" y="67" width="96" height="2.5" rx="1.25"/>
    <rect x="60" y="79" width="134" height="2.5" rx="1.25"/>
    <rect x="60" y="87" width="78" height="2.5" rx="1.25"/>
  </g>
  <rect x="60" y="99" width="6" height="3" rx="1" fill="#5bbf8f"/>

  <!-- status bar -->
  <rect x="52" y="195" width="30" height="2" rx="1" fill="#3a3f47"/>
  <rect x="88" y="195" width="20" height="2" rx="1" fill="#3a3f47"/>
</svg>
